<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monesa – Quản lý tài chính</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-storage-compat.min.js"></script>
<link rel="stylesheet" href="style.css"> 
</head>
<body>

<!-- ĐĂNG NHẬP -->
<div class="auth" id="auth">
 <div class="card">
  <div style="display:flex;align-items:center"><div class="logo" style="flex:1;padding:0"><i></i>Monesa</div><button class="btn o tbtn" data-theme-toggle aria-label="Đổi giao diện sáng tối">◐</button></div>
  <div id="authNote" class="alert w hide"></div>
  <div class="tabs"><button id="tLogin" class="on">Đăng nhập</button><button id="tReg">Đăng ký</button></div>
  <button class="btn o gbtn" id="bGoogle"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span id="gTxt">Tiếp tục với Google</span></button>
  <div class="sep">hoặc dùng email</div>
  <div><label>Email</label><input id="em" type="email" autocomplete="email"></div>
  <div><label>Mật khẩu (tối thiểu 6 ký tự)</label><input id="pw" type="password" autocomplete="current-password"></div>
  <div id="authErr" class="exp" role="alert"></div>
  <button class="btn" id="bSubmit">Đăng nhập</button>
 </div>
</div>

<div class="app hide" id="app">
 <aside id="side">
  <div class="logo"><i></i>Monesa</div>
  <div class="mode"><button data-mode="personal">Cá nhân</button><button data-mode="business">Doanh nghiệp</button></div>
  <button class="nav" data-p="dash">▦ Tổng quan</button>
  <button class="nav" data-p="tx">⇄ Giao dịch</button>
  <button class="nav" data-p="bud">◔ Ngân sách</button>
  <button class="nav" data-p="ai">✦ Trợ lý tài chính</button>
  <button class="nav" data-p="goal">⚑ Mục tiêu tiết kiệm</button>
  <div style="flex:1"></div>
  <div class="muted" id="who" style="font-size:12px;word-break:break-all;padding:0 8px"></div>
  <button class="nav" id="logout">⎋ Đăng xuất</button>
 </aside>

 <main>
  <div class="top">
   <button class="btn o" id="menuBtn" aria-label="Mở menu">☰</button>
   <h1 id="title"></h1>
   <button class="btn o tbtn" data-theme-toggle aria-label="Đổi giao diện sáng tối">◐</button>
   <div style="width:130px"><select id="cur" aria-label="Tiền tệ hiển thị"></select></div>
   <input id="month" type="month" style="width:160px" aria-label="Chọn tháng">
  </div>
  <div id="view"></div>
 </main>
</div>

<div id="modalRoot"></div>

<script src="script.js"></script>
</body>
</html>
